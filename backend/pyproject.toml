[project]
name = "prscope"
version = "0.1.0"
description = "Pull Request Verification & Review Evidence Planner — local-first, deterministic change-impact and verification planning."
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PRScope Contributors" }]
keywords = ["code-review", "pull-request", "change-impact", "verification", "static-analysis"]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pip-licenses>=5"]

[project.scripts]
prscope = "prscope.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["prscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101: assert in tests. B008: FastAPI Depends() in defaults is idiomatic.
# S310: urllib calls are localhost-only (Ollama) and guarded. S608: SQL column
# names are fixed in-code identifiers (never user input); values are parameterized.
ignore = ["S101", "B008", "S310", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]
